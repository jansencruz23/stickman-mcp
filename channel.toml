# Channel-wide production settings, locked once and reused by every Run.
# Tuning the style prefix and voice is a one-off setup session, not a per-video decision.
# Relative paths resolve against this file's directory.

[paths]
projects_dir = "projects"
music_dir = "music"

[style]
# Prepended to every Image Prompt by the server; Claude's prompts describe scene content only.
# Relocked 2026-08-22 for the crude look, on the second attempt: the wobble rides on the flat cartoon
# rather than replacing it. "crude", "hand drawn" and "scribbled shading" all read to Meta as
# traditional media, and drew crayon on paper; only the line-quality words may say imperfect.
# The stick figure treatment is people only: saying "characters" gave animals human heads and stick limbs.
# The people clause says "any", because "people drawn as..." read to Meta as "there are people": an
# intestine close-up came back in a meadow with three bystanders, a dog and a sheep watching it.
# The matching animal clause left the prefix on 2026-08-23 for the same reason - naming animals on every
# image kept supplying them. It lives in the Image Prompt of Scenes that have one, like a Visual Bible entry.
# Eyes and eyebrows are pinned to an exact count and shape, or they drift between Scenes of one video.
# The aspect clause leads and closes the prefix: buried at the end it was ignored on 18 of 25 Scenes,
# and Meta answers only to words here, since it takes no size parameter.
prefix = "16:9 widescreen landscape frame, much wider than it is tall, flat 2d cartoon illustration, any people are drawn as stick figures with big round slightly lopsided cream circle heads, exactly two small solid black dots for eyes and one short flat black line above each eye, plain thin black stick arms and legs drawn as unbroken slightly wobbly lines, bold uneven hand inked black outlines, flat muted colour fills, simple flat scenery, no gradients, wide 16:9 landscape composition,"
negative_prompt = "photorealistic, 3d render, photograph, text, watermark, signature, blurry, extra limbs, cluttered background, joint dots, visible elbow and knee joints, stick figure animals, animals with human heads, round human head on an animal, animal standing on two stick legs, portrait orientation, square image, tall narrow frame, clean vector art, smooth even line weight, ruler straight lines, paper texture, wax crayon, pencil sketch, pencil shading, hatching, brush strokes, bystanders, onlookers, spectators, freckles, cheek dots, zigzag eyebrows, scribbled eyebrows, bushy eyebrows"

[voice]
# Locked 2026-08-16 from the voice audition.
name = "am_puck"
# Passed straight to Kokoro, whose scale is not linear: 1.25 measures 1.18x faster. The 1.07x once
# recorded for 1.15 came off a single line; the same 87 Scenes spoken both ways measure 1.10x.
# Back to 1.0 on 2026-08-23: 1.15 was set against 8-15 second Scenes, and at 3 seconds a Scene the
# delivery had no room to land a line before the picture cut.
speed = 1.0

[render]
width = 1920
height = 1080
fps = 30
# Silent pause held between Scenes, in both the audio track and the image timing.
# 0.4 to 0.2 on 2026-08-20, then to 0.0 on 2026-08-23: at 4-7 second Scenes even a fifth of a
# second lands as a stumble between sentences, and Kokoro already leaves a breath at each clip edge.
scene_gap_seconds = 0.0
# Music bed level relative to the narration.
music_level_db = -22.0

[image]
# Where the pixels come from: "sdxl" draws locally on the GPU, "meta-ai" drives meta.ai in a browser.
# Switched 2026-08-20 after the style check: Meta AI matches the locked prefix, local SDXL did not.
backend = "meta-ai"
# Near-16:9 generation size, upscaled and padded to the render resolution.
# The four settings below reach the local backend only; Meta AI takes no size, steps or guidance.
width = 1344
height = 768
steps = 4
guidance_scale = 1.0
# Per-Scene seeds are base_seed + scene id, so a batch is reproducible.
base_seed = 20260813

# Read only when image.backend is "meta-ai". The profile folder is the entire login: fill it once
# with scripts/meta_login.py. It is gitignored, and the server never handles a password.
[meta_ai]
profile_dir = "browser-profile"
# Sequential and unhurried: the pause held between Scene requests.
request_delay_seconds = 8.0
# How long one picture may take before the job gives up on it.
timeout_seconds = 180.0
