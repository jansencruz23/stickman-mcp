# Channel-wide production settings, locked once and reused by every Run.
# Tuning the style prefix and voice is a one-off setup session, not a per-video decision.
# Relative paths resolve against this file's directory.

[paths]
projects_dir = "projects"
music_dir = "music"

[style]
# Prepended to every Image Prompt by the server; Claude's prompts describe scene content only.
# Relocked 2026-08-22 for the crude look, on the second attempt: the wobble rides on the flat cartoon
# rather than replacing it. "crude", "hand drawn" and "scribbled shading" all read to Meta as
# traditional media, and drew crayon on paper; only the line-quality words may say imperfect.
# The stick figure treatment is people only: saying "characters" gave animals human heads and stick limbs.
# The animal clause left the prefix on 2026-08-23 - naming animals on every image kept supplying them.
# It lives in the Image Prompt of Scenes that have one, like a Visual Bible entry.
# The people clause followed it out on 2026-08-26, for the same reason and to the table below: "any"
# softened it but never fixed it, and an intestine close-up still came back in a meadow with three
# bystanders watching. Counted across two videos, only about a third of Scenes hold a person, so the
# clause was inviting people into the other two thirds - including Scenes whose prompt said "empty".
# The aspect clause leads and closes the prefix: buried at the end it was ignored on 18 of 25 Scenes,
# and Meta answers only to words here, since it takes no size parameter.
prefix = "16:9 widescreen landscape frame, much wider than it is tall, flat 2d cartoon illustration, bold uneven hand inked black outlines, flat muted colour fills, simple flat scenery, no gradients, wide 16:9 landscape composition,"
negative_prompt = "photorealistic, 3d render, photograph, text, watermark, signature, blurry, extra limbs, cluttered background, joint dots, visible elbow and knee joints, stick figure animals, animals with human heads, round human head on an animal, animal standing on two stick legs, portrait orientation, square image, tall narrow frame, clean vector art, smooth even line weight, ruler straight lines, paper texture, wax crayon, pencil sketch, pencil shading, hatching, brush strokes, bystanders, onlookers, spectators, freckles, cheek dots, zigzag eyebrows, scribbled eyebrows, bushy eyebrows"

# Clauses a Scene opts into by name. Off by default: an unmarked Scene loses an anatomy rule, which
# costs one picture, rather than gaining a person nobody asked for, which is the bug this table fixes.
# Eyes and eyebrows are pinned to an exact count and shape, or they drift between Scenes of one video.
# Must stay last in [style] - TOML swallows any bare key written after a sub-table.
[style.clauses]
people = "any people are drawn as stick figures with big round slightly lopsided cream circle heads, exactly two small solid black dots for eyes and one short flat black line above each eye, plain thin black stick arms and legs drawn as unbroken slightly wobbly lines,"

# Shot grammar, added 2026-09-08. A Scene names one, and only one, to say where the camera is.
# The complaint they answer: Scenes that are each a single floating object read as random rather
# than directed. UNPROVEN until the style probe runs - a composed layout is the recorded way to
# lose the prefix entirely (a 2x2 panel grid came back watercolour, 2026-08-31), so these stay
# plain camera words and never describe panels, frames or splits. Keep them short: every word here
# competes with the aspect clause, and close shots are the ones most likely to drift off 16:9.
shot_wide = "seen from far back, the whole setting visible across the frame, the subject small in it,"
shot_medium = "seen from the waist up, filling the middle of the frame,"
shot_close = "seen close, head and shoulders only, still in a wide landscape frame,"
shot_low = "seen from low down looking up at the subject,"
shot_high = "seen from high up looking down on the subject,"
shot_over_shoulder = "seen from behind one figure, past their shoulder, at what they are looking at,"

[voice]
# am_puck 2026-08-16, then am_santa on 2026-09-09 for a warmer read, off the widened
# 28 voice audition in tuning/voice-audition/speed-1.15.
name = "am_santa"
# Passed straight to Kokoro, whose scale is not linear: 1.25 measures 1.18x faster. The 1.07x once
# recorded for 1.15 came off a single line; the same 87 Scenes spoken both ways measure 1.10x.
# Back to 1.0 on 2026-08-23: 1.15 was set against 8-15 second Scenes, and at 3 seconds a Scene the
# delivery had no room to land a line before the picture cut.
# To 1.15 on 2026-08-31 by request, with Scenes back at 7-10 seconds. Kokoro's scale is not linear:
# this measures about 1.10x faster. channel_config() is lru_cached in server.py, so a running server
# keeps the value it read first - a Run started before a restart must synthesize out of process.
speed = 1.15

[render]
width = 1920
height = 1080
fps = 30
# Silent pause held between Scenes, in both the audio track and the image timing.
# 0.4 to 0.2 on 2026-08-20, then to 0.0 on 2026-08-23: at 4-7 second Scenes even a fifth of a
# second lands as a stumble between sentences, and Kokoro already leaves a breath at each clip edge.
scene_gap_seconds = 0.0
# Music bed level relative to the narration.
music_level_db = -22.0

[image]
# Where the pixels come from: "sdxl" draws locally on the GPU, "meta-ai" drives meta.ai in a browser.
# Switched 2026-08-20 after the style check: Meta AI matches the locked prefix, local SDXL did not.
backend = "meta-ai"
# Near-16:9 generation size, upscaled and padded to the render resolution.
# The four settings below reach the local backend only; Meta AI takes no size, steps or guidance.
width = 1344
height = 768
steps = 4
guidance_scale = 1.0
# Per-Scene seeds are base_seed + scene id, so a batch is reproducible.
base_seed = 20260813

# Read only when image.backend is "meta-ai". The profile folder is the entire login: fill it once
# with scripts/meta_login.py. It is gitignored, and the server never handles a password.
[meta_ai]
# Second account from 2026-09-09: the first hit Meta's image cap mid Run, and it does not
# reset until 29 September. The old folder is left in place, so going back is this one line.
profile_dir = "browser-profile-2"
# Sequential and unhurried: the pause held between Scene requests.
request_delay_seconds = 8.0
# How long one picture may take before the job gives up on it.
timeout_seconds = 180.0
