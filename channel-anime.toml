# The third channel. Select it with STICKMAN_CHANNEL_CONFIG=channel-anime.toml.
# Stories and scenarios in an anime look, told in the narrative format. Its doctrine is in
# docs/channels/anime.md; this file holds only what the server reads.
#
# NOT YET USABLE. The style prefix and negative prompt below are placeholders, and the probe in
# docs/channels/anime.md has to run before either is written for real. Nobody has ever asked Meta
# for anime: every recorded style experiment stayed inside the crude-cartoon family, and the two
# stickman channels ban "clean vector art" and "smooth even line weight", which is close to a
# description of what anime is. So this negative prompt is built from scratch rather than copied.

[paths]
projects_dir = "projects-anime"
music_dir = "music"

[style]
# Locked 2026-09-08 from the four candidate anime grid in tuning/style-grid/anime. "flat-cel" won
# on the only thing that matters for a channel: it drew a face, an interior and an empty exterior in
# the same treatment, and left the empty street empty. The three it beat all drifted - "soft-cel"
# toward gradients, "retro-cel" and "painted" into brushwork and washes, which is the same trap the
# first probe fell into when "anime illustration" named no medium at all.
# It pins the same four things channel one's prefix pins: line quality, how it is shaded, the
# palette, and how backgrounds are treated. Drop any one and the look stops holding.
# The aspect clause leads and closes it, measured on channel one: buried at the end it was ignored
# on 18 of 25 Scenes, and Meta takes no size parameter so words are the only control.
prefix = "16:9 widescreen landscape frame, much wider than it is tall, flat 2d anime cel animation still, clean even black outlines of constant weight, flat blocks of colour with one hard edged shadow tone and no soft gradients, bright saturated palette, simple uncluttered backgrounds, wide 16:9 landscape composition,"
# Built from what the losing candidates actually did, not copied from the stickman channels - their
# list bans "clean vector art" and "smooth even line weight", which describe this look. Everything
# here is a drift observed in the grid: brushwork and washes from the painted candidates, gradients
# from soft-cel, grain and fade from retro-cel.
negative_prompt = "photorealistic, 3d render, photograph, text, watermark, signature, blurry, extra limbs, portrait orientation, square image, tall narrow frame, painterly, brush strokes, visible brushwork, watercolour, gouache, oil painting, canvas texture, paper texture, film grain, soft gradients, airbrushed shading, muted faded colours, sketchy uneven lines, pencil sketch"

# Same opt-in rule as every channel: a clause rides on the Scenes that need it, never channel-wide.
# The shot grammar is shared with the stickman channels, so a Scene reads the same on any of them.
# Probed 2026-09-08 on this channel: wide, close and over_shoulder all held the look and the 16:9
# frame, close included, which was the one expected to drift portrait. low, high and medium are
# still unproven. over_shoulder necessarily invents a second figure - it is a two person shot by
# definition - so it belongs only on Scenes that actually have two people.
[style.clauses]
shot_wide = "seen from far back, the whole setting visible across the frame, the subject small in it,"
shot_medium = "seen from the waist up, filling the middle of the frame,"
shot_close = "seen close, head and shoulders only, still in a wide landscape frame,"
shot_low = "seen from low down looking up at the subject,"
shot_high = "seen from high up looking down on the subject,"
shot_over_shoulder = "seen from behind one figure, past their shoulder, at what they are looking at,"
plain_card = "the whole frame behind the lettering is one flat empty background colour, no ground, no grass, no plants, no flowers, no bushes, no hills, no sky, no clouds, no horizon line, no scenery of any kind,"

[voice]
# One production voice across all three channels, so a new channel needs no second audition.
name = "am_santa"
speed = 1.15

[render]
width = 1920
height = 1080
fps = 30
scene_gap_seconds = 0.0
music_level_db = -22.0

[image]
backend = "meta-ai"
width = 1344
height = 768
steps = 4
guidance_scale = 1.0
base_seed = 20260904

# The same Meta account as the other two channels, by decision: one Run a day across all of them,
# so a third channel makes no new claim on the roughly twenty one images a day the account allows.
[meta_ai]
profile_dir = "browser-profile"
request_delay_seconds = 8.0
timeout_seconds = 180.0
