<!doctype html>
<meta charset="utf-8">
<title>Meta AI stub</title>
<!-- Stands in for meta.ai's chat: a hidden textarea and the real composer sharing one testid, the
     composer mounting late the way a hydrating page does, an avatar too small to be an answer, and a
     picture that arrives as a blob. Offline by construction. -->
<h1>Ask Meta AI anything</h1>
<img id="avatar" alt="avatar" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAIAAABvFaqvAAAAHUlEQVR4nGPgpBJgGDVo1KBRg0YNGjVo1KCBNwgA8/k8weObwb0AAAAASUVORK5CYII=">
<div id="thread"></div>
<textarea id="shadow" data-testid="composer-input" placeholder="Ask Meta AI..."
          style="position:absolute;width:200px;height:20px;overflow:hidden;border:0;padding:0"></textarea>
<script>
  const ANSWER = "iVBORw0KGgoAAAANSUhEUgAAAoAAAAFoCAIAAABIUN0GAAAFk0lEQVR4nO3VQQ0AIBDAsBOAQhQjCxfsQZMK2G+zzgYAHpu8AAA+ZMAAEDBgAAgYMAAEDBgAAgYMAAEDBoCAAQNAwIABIGDAABAwYAAIGDAABAwYAAIGDAABAwaAgAEDQMCAASBgwAAQMGAACBgwAAQMGAACBgwAAQMGgIABA0DAgAEgYMAAEDBgAAgYMAAEDBgAAgYMAAEDBoCAAQNAwIABIGDAABAwYAAIGDAABAwYAAIGDAABAwaAgAEDQMCAASBgwAAQMGAACBgwAAQMGAACBgwAAQMGgIABA0DAgAEgYMAAEDBgAAgYMAAEDBgAAgYMAAEDBoCAAQNAwIABIGDAABAwYAAIGDAABAwYAAIGDAABAwaAgAEDQMCAASBgwAAQMGAACBgwAAQMGAACBgwAAQMGgIABA0DAgAEgYMAAEDBgAAgYMAAEDBgAAgYMAAEDBoCAAQNAwIABIGDAABAwYAAIGDAABAwYAAIGDAABAwaAgAEDQMCAASBgwAAQMGAACBgwAAQMGAACBgwAAQMGgIABA0DAgAEgYMAAEDBgAAgYMAAEDBgAAgYMAAEDBoCAAQNAwIABIGDAABAwYAAIGDAABAwYAAIGDAABAwaAgAEDQMCAASBgwAAQMGAACBgwAAQMGAACBgwAAQMGgIABA0DAgAEgYMAAEDBgAAgYMAAEDBgAAgYMAAEDBoCAAQNAwIABIGDAABAwYAAIGDAABAwYAAIGDAABAwaAgAEDQMCAASBgwAAQMGAACBgwAAQMGAACBgwAAQMGgIABA0DAgAEgYMAAEDBgAAgYMAAEDBgAAgYMAAEDBoCAAQNAwIABIGDAABAwYAAIGDAABAwYAAIGDAABAwaAgAEDQMCAASBgwAAQMGAACBgwAAQMGAACBgwAAQMGgIABA0DAgAEgYMAAEDBgAAgYMAAEDBgAAgYMAAEDBoCAAQNAwIABIGDAABAwYAAIGDAABAwYAAIGDAABAwaAgAEDQMCAASBgwAAQMGAACBgwAAQMGAACBgwAAQMGgIABA0DAgAEgYMAAEDBgAAgYMAAEDBgAAgYMAAEDBoCAAQNAwIABIGDAABAwYAAIGDAABAwYAAIGDAABAwaAgAEDQMCAASBgwAAQMGAACBgwAAQMGAACBgwAAQMGgIABA0DAgAEgYMAAEDBgAAgYMAAEDBgAAgYMAAEDBoCAAQNAwIABIGDAABAwYAAIGDAABAwYAAIGDAABAwaAgAEDQMCAASBgwAAQMGAACBgwAAQMGAACBgwAAQMGgIABA0DAgAEgYMAAEDBgAAgYMAAEDBgAAgYMAAEDBoCAAQNAwIABIGDAABAwYAAIGDAABAwYAAIGDAABAwaAgAEDQMCAASBgwAAQMGAACBgwAAQMGAACBgwAAQMGgIABA0DAgAEgYMAAEDBgAAgYMAAEDBgAAgYMAAEDBoCAAQNAwIABIGDAABAwYAAIGDAABAwYAAIGDAABAwaAgAEDQMCAASBgwAAQMGAACBgwAAQMGAACBgwAAQMGgIABA0DAgAEgYMAAEDBgAAgYMAAEDBgAAgYMAAEDBoCAAQNAwIABIGDAABAwYAAIGDAABAwYAAIGDAABAwaAgAEDQMCAASBgwAAQMGAACBgwAAQMGAACBgwAAQMGgIABA0DAgAEgYMAAEDBgAAgYMAAEDBgAAgYMAAEDBoCAAQNAwIABIGDAABAwYAAIGDAABAwYAAIGDAABAwaAgAEDQMCAASBgwAAQMGAACBgwAAQMGAACBgwAAQMGgIABA0DAgAEgYMAAEDBgAAgYMAAEDBgAAgYMAAEDBoCAAQNAwIABIGDAABAwYAAIGDAABAwYAAIGDAABAwaAgAEDQMCAASBgwAAQMGAACBgwAAQMGAACBgwAAQMGgMAFPQz2LDu6lhEAAAAASUVORK5CYII=";

  function answer() {
    const bytes = Uint8Array.from(atob(ANSWER), (character) => character.charCodeAt(0));
    // Meta keeps only the newest picture on the page, so the answer replaces its predecessor
    // rather than joining it. Counting pictures therefore never tells you a new one arrived.
    let picture = document.querySelector("img[alt=generated]");
    if (!picture) {
      picture = document.createElement("img");
      picture.alt = "generated";
      document.getElementById("thread").appendChild(picture);
    }
    picture.src = URL.createObjectURL(new Blob([bytes], {type: "image/png"}));
  }

  function submitted(event) {
    if (event.key !== "Enter") return;
    event.preventDefault();
    const composer = event.currentTarget;
    const asked = document.createElement("p");
    asked.className = "asked";
    asked.textContent = composer.textContent;
    document.getElementById("thread").appendChild(asked);
    composer.textContent = "";
    if (!document.getElementById("title")) {
      // Meta grows a conversation-title box once a thread exists, ahead of the composer.
      const title = document.createElement("input");
      title.id = "title";
      title.type = "text";
      title.placeholder = "Conversation title";
      document.body.insertBefore(title, document.body.firstChild);
    }
    setTimeout(answer, 250);
  }

  // Mid-hydration the hidden textarea still has a box, which is how it can be picked by mistake.
  setTimeout(() => {
    const shadow = document.getElementById("shadow");
    shadow.style.width = "0";
    shadow.style.height = "0";
  }, 300);

  // The real composer mounts after the page does, so anything typing at once races it.
  setTimeout(() => {
    const composer = document.createElement("div");
    composer.id = "composer";
    composer.setAttribute("data-testid", "composer-input");
    composer.setAttribute("role", "textbox");
    composer.setAttribute("contenteditable", "true");
    composer.addEventListener("keydown", submitted);
    document.body.appendChild(composer);
  }, 600);
</script>
