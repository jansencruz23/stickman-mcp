  composer.addEventListener("keydown", (event) => {

    const asked = document.createElement("p");
    asked.className = "asked";
    asked.textContent = composer.textContent;
    document.getElementById("thread").appendChild(asked);
    composer.textContent = "";
    if (!document.getElementById("title")) {
      // Meta grows a conversation-title box once a thread exists, ahead of the composer.
      const title = document.createElement("input");
      title.id = "title";
      title.type = "text";
      title.placeholder = "Conversation title";
      document.body.insertBefore(title, document.body.firstChild);
    }
    setTimeout(() => {
      const bytes = Uint8Array.from(atob(ANSWER), (character) => character.charCodeAt(0));
      const picture = document.createElement("img");
      picture.alt = "generated";
      picture.src = URL.createObjectURL(new Blob([bytes], {type: "image/png"}));
      document.getElementById("thread").appendChild(picture);
    }, 250);
